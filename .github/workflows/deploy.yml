name: Deploy to Oracle VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add VM host key to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VM2_PORT || '22' }} -H ${{ secrets.VM2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Oracle VM over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM2_HOST }}
          username: ${{ secrets.VM2_USER }}
          port: ${{ secrets.VM2_PORT || '22' }}
          key: ${{ secrets.VM2_SSH_KEY }}
          script: |
            set -e
            cd "$HOME/evosense-client-web-api"
            git fetch https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git main
            git reset --hard FETCH_HEAD
            npm ci
            npm run build
            npm prune --omit=dev
            sudo cp evosense-client-web-api.service /etc/systemd/system/evosense-client-web-api.service
            sudo sed -i "s|/opt/evosense-client-web-api|$HOME/evosense-client-web-api|g" /etc/systemd/system/evosense-client-web-api.service
            sudo sed -i "s|User=ubuntu|User=$(whoami)|g" /etc/systemd/system/evosense-client-web-api.service
            sudo sed -i "s|/usr/bin/node|$(which node)|g" /etc/systemd/system/evosense-client-web-api.service
            sudo systemctl daemon-reload
            sudo systemctl restart evosense-client-web-api.service
            sudo systemctl status evosense-client-web-api.service --no-pager