version: '3.8'

services:
  evosense-client-web-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evosense-client-web-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_PATH=/app/data/evosense.db
    volumes:
      - evosense_data:/app/data

volumes:
  evosense_data:
